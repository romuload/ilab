<script>
// abertura: uma vez por sessão; ?intro=1 força e ?intro=0 pula
(() => {
  const q = new URLSearchParams(location.search).get('intro');
  let visto = false; try { visto = !!sessionStorage.getItem('ilab-intro'); } catch (e) { }
  if (q === '1' || (q !== '0' && !visto)) document.documentElement.classList.add('intro-on');
})();

<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#F0F3F1; --hover:#EBF0ED;
  --border:#E1E6E3; --border-strong:#C5CEC9;
  --fg:#16201B; --fg-2:#46534C; --fg-3:#67736C;
  --brand:#0A7A4A; --brand-hover:#086640; --brand-subtle:#E4F3EA; --on-brand:#FFFFFF;
  --danger:#BF3328; --danger-subtle:#FBEAE8; --warn:#8F5600; --warn-subtle:#FFF2D9;
  --ok:#1B7740; --ok-subtle:#E4F4E9; --info:#2157D3; --info-subtle:#E8EFFD;
  --purple:#6A3CCB; --purple-subtle:#EFE9FC; --liquid:#A9C2B8;
  --shadow-1:0 1px 2px rgba(18,44,30,.06),0 1px 3px rgba(18,44,30,.05); --shadow-3:0 20px 56px rgba(18,44,30,.20);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C19; --surface-2:#1A2320; --hover:#1F2925; --border:#25302B; --border-strong:#34413B;
  --fg:#E6ECE8; --fg-2:#B2BDB7; --fg-3:#8A968F; --brand:#3BBF7C; --brand-hover:#56CF90; --brand-subtle:#14301F; --on-brand:#06170E;
  --danger:#F07468; --danger-subtle:#371917; --warn:#F0B44E; --warn-subtle:#33260E; --ok:#4BC27E; --ok-subtle:#11301D;
  --info:#7DA6FF; --info-subtle:#172540; --purple:#B49AF5; --purple-subtle:#261C40; --liquid:#4E6B60;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-3:0 20px 56px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C19; --surface-2:#1A2320; --hover:#1F2925; --border:#25302B; --border-strong:#34413B;
  --fg:#E6ECE8; --fg-2:#B2BDB7; --fg-3:#8A968F; --brand:#3BBF7C; --brand-hover:#56CF90; --brand-subtle:#14301F; --on-brand:#06170E;
  --danger:#F07468; --danger-subtle:#371917; --warn:#F0B44E; --warn-subtle:#33260E; --ok:#4BC27E; --ok-subtle:#11301D;
  --info:#7DA6FF; --info-subtle:#172540; --purple:#B49AF5; --purple-subtle:#261C40; --liquid:#4E6B60;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-3:0 20px 56px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/20px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
p{margin:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{height:60px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-weight:500}
.back:hover{background:var(--hover);color:var(--fg)}
.brand{display:flex;align-items:center;color:var(--fg);text-decoration:none;padding:4px 14px 4px 0;border-right:1px solid var(--border)}
.brand ilab-logo{font-size:26px}
.ttl b{display:block;font-size:16px;line-height:20px}
.ttl span{font-size:12px;color:var(--fg-3)}
.sp{flex:1}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:6px;border:0;background:none;color:var(--fg-2);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1);font-weight:600}
.seg .n{font-size:11px;color:var(--fg-3);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn .ic{width:16px;height:16px}

.lab{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stage{position:relative;min-width:0;min-height:0;background:#d9dedb;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#4b5651;font-weight:500;background:#e4e8e6}
.loading[hidden]{display:none}
.hud{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.hud .btn{box-shadow:var(--shadow-1)}
.crumb{position:absolute;left:14px;top:14px;right:250px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
.crumb>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);font-size:13px;font-weight:600;color:#16201B;border:0;box-shadow:0 1px 3px rgba(0,0,0,.14);white-space:nowrap;font-family:inherit}
.pill .ic{width:16px;height:16px}
button.pill{cursor:pointer;transition:background .15s,transform .15s}
button.pill:hover{background:#fff;transform:translateX(-2px)}
.pill.cur{background:#0A7A4A;color:#fff;animation:pop .35s ease}
.crumb .sep{color:#4b5651;font-weight:600}
.crumb .esc{font-size:12px;color:#36403b;background:rgba(255,255,255,.72);padding:5px 9px;border-radius:7px}
.crumb kbd{font:600 11px Inter,sans-serif;border:1px solid #b9c1bd;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes pin{from{opacity:0;transform:translateX(14px)}}
.panel>*{animation:pin .3s ease}
@media (prefers-reduced-motion:reduce){.panel>*,.pill.cur{animation:none}}
.tip{position:absolute;pointer-events:none;z-index:5;background:rgba(18,26,22,.92);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;line-height:16px;transform:translate(14px,14px);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13px}
.tip[hidden]{display:none}
.legend{position:absolute;left:14px;bottom:14px;width:300px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);color:#16201B;border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.legend[hidden]{display:none}
.legend h3{font-size:13px;margin-bottom:10px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.legend li{display:flex;gap:10px;align-items:center;font-size:12px;line-height:16px;color:#46534C}
.legend li b{color:#16201B}
.legend a{display:inline-block;margin-top:10px;font-size:12px;color:#0A7A4A;font-weight:600}
.led{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.06)}

.panel{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.p-head{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.p-head .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.p-title{display:flex;gap:14px;align-items:center}
.p-title h2{font-size:20px;line-height:26px}
.p-title p{color:var(--fg-3);font-size:13px}
.p-body{padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:6px;white-space:nowrap}
.st .ic{width:14px;height:14px;stroke-width:2.2}
.st-ok{background:var(--ok-subtle);color:var(--ok)} .st-danger{background:var(--danger-subtle);color:var(--danger)}
.st-warn{background:var(--warn-subtle);color:var(--warn)} .st-info{background:var(--info-subtle);color:var(--info)}
.st-purple{background:var(--purple-subtle);color:var(--purple)} .st-neutral{background:var(--surface-2);color:var(--fg-2)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--fg-2)}
.sec h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;font-weight:500}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--border)}
.steps i.on{background:var(--brand)}
.steps-l{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);margin-top:6px}
.mlist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;width:100%}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--hover)}
.mrow.sel{background:var(--brand-subtle)}
.mrow .mm{flex:1;min-width:0}
.mrow .mm b{display:block;font-size:13px;line-height:18px}
.mrow .mm span{font-size:12px;color:var(--fg-3)}
.mrow .val{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;font-weight:600}
.mrow .val small{display:block;font-weight:400;color:var(--fg-3);font-size:11px}
.mrow .val.bad{color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;line-height:18px;color:var(--fg-2)}
.note .ic{margin-top:1px}
.note.warn{background:var(--warn-subtle)} .note.bad{background:var(--danger-subtle)}
.ticket{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:17px;background:repeating-linear-gradient(var(--surface-2),var(--surface-2) 16px,var(--surface) 16px,var(--surface) 17px);border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum button{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px;text-align:left;cursor:pointer}
.sum button:hover{border-color:var(--border-strong)}
.sum b{display:block;font-size:22px;line-height:28px}
.sum span{font-size:12px;color:var(--fg-3)}
.sum .bad b{color:var(--danger)}
.sum button.on{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline}
.live{min-height:0}
.si{display:block;flex:none}

/* ---- abertura (≤ 5 s) ---- */
.intro{display:none}
.intro-on .intro{display:block;position:fixed;inset:0;z-index:100;background:#050d0a;color:#E6ECE8;overflow:hidden;cursor:pointer;user-select:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.in-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(0,0,0,.6) 100%)}
.in-grain{position:absolute;inset:-60px;pointer-events:none;opacity:.08;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-31px,17px)}66%{transform:translate(23px,-29px)}}
.in-words{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tk{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;will-change:transform,opacity}
.tk-t{font:600 14px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a6cbb9}
.tk-n{font:500 30px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;color:#FFC14D;letter-spacing:-.02em;text-shadow:0 0 18px rgba(255,170,40,.35)}
.tk-m{font:500 13px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;color:#E6ECE8;border:1px solid rgba(230,236,232,.32);padding:6px 9px;border-radius:4px;letter-spacing:.04em}
.in-bar{position:absolute;left:0;right:0;height:max(9vh,46px);background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,32px);font:500 11px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#6f8a7d;transition:transform .75s cubic-bezier(.7,0,.2,1)}
.in-bar.top{top:0}.in-bar.bot{bottom:0}
.in-bar ilab-logo{font-size:17px;margin-right:4px;vertical-align:-1px;font-family:Inter,sans-serif;letter-spacing:-.04em;text-transform:none}
.intro.out .in-bar.top{transform:translateY(-100%)}.intro.out .in-bar.bot{transform:translateY(100%)}
.in-skip{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#d8e4de;background:none;border:1px solid rgba(216,228,222,.3);border-radius:999px;height:30px;padding:0 14px;cursor:pointer}
.in-skip:hover{background:rgba(255,255,255,.08)}
.in-brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .5s}
.in-brand ilab-logo{font-size:clamp(68px,14vw,140px);color:#F2F6F3}
.in-brand ilab-logo>span{opacity:0;filter:blur(14px);transform:translateX(-.3em);transition:opacity .45s,filter .6s,transform .75s cubic-bezier(.16,.9,.2,1)}
.in-brand ilab-logo>span:last-child{transform:translateX(.3em)}
.in-brand ilab-logo .lg-a{opacity:0;transition:opacity .3s}
.in-brand.on ilab-logo>span{opacity:1;filter:blur(0);transform:none}
.in-brand.on ilab-logo>span:nth-child(2){transition-delay:.05s}
.in-brand.on ilab-logo>span:last-child{transition-delay:.1s}
.in-brand.a ilab-logo .lg-a{opacity:1}
.in-brand p{margin:0;font:500 clamp(11px,1.4vw,14px)/1 Inter,sans-serif;letter-spacing:.6em;text-transform:uppercase;color:#9fb5aa;opacity:0;transition:opacity .6s .25s,letter-spacing 1.4s .2s cubic-bezier(.16,.9,.2,1)}
.in-brand.on p{opacity:1;letter-spacing:.3em}
.intro.out .in-brand{transform:scale(1.08);opacity:0}
@media (prefers-reduced-motion:reduce){.in-grain{animation:none}}
@media (max-width:900px){
  .lab{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .panel{border-left:0;border-top:1px solid var(--border)}
  .top .seg,.top .hide-sm{display:none}
  .legend{width:auto;right:14px}
}
@media (max-width:520px){.ttl span{display:none}.hud .label{display:none}.crumb{right:110px}.crumb .esc{display:none}.lab{grid-template-rows:48vh auto}}
</style>

function fillet(pts, radii, seg = 12) {
  const out = [];

    const r = radii[i], Pt = pts[i];

    let dirty = false;
    if (Math.abs(o.H - o.HT) > .003) { o.H += (o.HT - o.H) * Math.min(1, dt * 2); dirty = true; }
    const nv = o.vort + (o.vortT - o.vort) * Math.min(1, dt * 2.5); if (Math.abs(nv - o.vort) > 1e-4) { o.vort = nv; dirty = true; }
    if (dirty) rebuildFlask(o);
    if (o.stir && !reduce) o.rodG.rotation.y -= dt * 4;
    o.bubbles.forEach(b => { if (!b.visible) return; const u = b.userData; u.t += dt * (.35 + u.r * .4); if (u.t > 1) { u.t = 0; u.a = Math.random() * 6.28; u.r = Math.random() * .6; } const y = BT + .05 + u.t * Math.max(.1, o.H - BT - .1); const rr = Math.min(u.r, rAt(flaskInner, y) - .08); b.position.set(Math.cos(u.a) * rr, y, Math.sin(u.a) * rr); });
  });
  screenT += dt;
  if (screenT > .25) { screenT = 0; Object.values(eqObjs).forEach(o => { const st = EQ[o.k].st; if (st === 'ocupado' || st === 'edicao') drawScreen(o, t); }); if (sel?.kind === 'lims' || !sel) drawLims(t); }
  Object.values(eqObjs).forEach(o => {
    const st = EQ[o.k].st; o.ledM.emissiveIntensity = st === 'fora' ? (reduce ? 2 : 1.2 + Math.max(0, Math.sin(t * 4)) * 2.5) : st === 'ocupado' ? 1.8 + Math.sin(t * 2) * .4 : 2.2;
    o.tk.scale.y += (Math.max(.01, o.tkT) - o.tk.scale.y) * Math.min(1, dt * 1.2); o.tk.visible = o.tk.scale.y > .02;
  });
  ring.material.opacity = .55 + (reduce ? 0 : Math.sin(t * 3) * .25);
  if (sel?.kind === 'sample') ring.position.y = sel.base.y + sel.lift + .012;
  if (tween) {
    tween.u = tween.d ? Math.min(1, tween.u + dt / tween.d) : 1;
    const e = ease(tween.u);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    // arco suave: a câmera sobe um pouco no meio do voo
    camera.position.y += Math.sin(e * Math.PI) * Math.min(3, tween.p0.distanceTo(tween.p1) * .12);
    if (tween.u >= 1) { const d = tween.dist; tween = null; controls.enabled = true; setLimits(d); }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
