<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

const HOJE = new Date();
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtData = d => d.toLocaleDateString('pt-BR');
const fmtHora = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDH = d => `${fmtData(d)} ${fmtHora(d)}`;
const fmtCurto = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${fmtHora(d)}`;
const fmtN = (v, dec) => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
function relativo(d) {
  if (!d) return 'Nunca executada';
  const dias = Math.round((new Date(HOJE.getFullYear(), HOJE.getMonth(), HOJE.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (dias === 0) return `Hoje, ${fmtHora(d)}`;
  if (dias === 1) return `Ontem, ${fmtHora(d)}`;
  return `Há ${dias} dias`;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const em = (h, m, diasAtras = 0) => { const d = addDias(HOJE, -diasAtras); d.setHours(h, m, 0, 0); return d; };

/* ---------- domínio ---------- */
const ORGAOS = [['275', 'RECAP'], ['285', 'REVAP'], ['210', 'RPBC'], ['270', 'REPLAN']];
const orgNome = (c = S.orgao) => { const o = ORGAOS.find(o => o[0] === c); return `${o[0]} · ${o[1]}`; };

const MODOS = {
  analitico: { nome: 'Analítico', desc: 'Lista cada amostra com todos os resultados de ensaio.', uso: 'Acompanhar a rotina do laboratório', ic: 'table' },
  desvio: { nome: 'Desvio de especificação', desc: 'Mostra só os resultados que ficaram fora do limite especificado.', uso: 'Agir rápido em não conformidades', ic: 'alert' },
  online: { nome: 'On-line', desc: 'Atualiza sozinho a cada novo resultado que chega do laboratório.', uso: 'Monitorar uma unidade em tempo real', ic: 'activity' },
  estatistico: { nome: 'Estatístico', desc: 'Média, desvio padrão, mínimo e máximo de cada ensaio no período.', uso: 'Ver tendências e variabilidade', ic: 'chart' },
  certificado: { nome: 'Certificado de ensaio', desc: 'Gera o certificado de cada amostra, pronto para enviar ao cliente.', uso: 'Enviar certificados a clientes', ic: 'file' }
};
const modoBadge = m => `<span class="mb">${icon(MODOS[m].ic)}${MODOS[m].nome}</span>`;

const FILTROS = [
  { key: 'produto', label: 'Produto', ph: 'Buscar por código ou nome', primary: true, opts: ['620 · Gasolina A', '200 · Gás combustível', '203 · Gás ácido', '709 · Marine Fuel 30', '708 · Marine Diesel Oil', '140 · Petróleo nacional mistura', 'M01 · Corrente: gás de combustão', 'M02 · Corrente: gás de processo', 'M09 · Corrente: água ácida tratada', 'M12 · Corrente: água contaminada', 'M20 · Corrente: despejo industrial', '001 · Ácido nítrico', '003 · Amônia'] },
  { key: 'metodo', label: 'Método de ensaio', ph: 'Ex.: D-86, destilação', primary: true, opts: ['D-1796 · Água e sedimento', 'D-86 · Destilação', 'D-4052 · Massa específica', 'D-5453 · Enxofre total', 'D-6304 · Água (Karl Fischer)', 'D-2700 · Octanagem MON'] },
  { key: 'cliente', label: 'Cliente', ph: 'Buscar cliente', opts: ['EXT · Cliente externo', 'INT · Interno', 'ABAST · Abastecimento', 'GLPT · Transporte'] },
  { key: 'finalidade', label: 'Finalidade', ph: 'Buscar finalidade', opts: ['Controle de processo', 'Certificação', 'Liberação de tanque', 'Investigação'] },
  { key: 'tipoLocal', label: 'Tipo de local', ph: 'Navios, oleodutos…', opts: ['Navios', 'Oleodutos', 'Tanques', 'Outros locais'] },
  { key: 'local', label: 'Local', ph: 'Buscar local', opts: ['TQ-4101', 'TQ-4102', 'UP-MLG', 'Píer 2', 'Armazém'] },
  { key: 'amostragem', label: 'Tipo de amostragem', ph: 'Base, corrida, costado…', opts: ['Amostra de base', 'Amostra de corrida', 'Amostra de costado', 'Amostra de linha'] },
  { key: 'caracteristica', label: 'Característica', ph: 'Buscar característica', opts: ['Cianetos', 'NH₃', 'pH', 'Sulfeto'] }
];
const FMAP = Object.fromEntries(FILTROS.map(f => [f.key, f]));
const COMPARTILHAR = ['Grupo · Recap Laboratório (12)', 'Grupo · Equipe iLab (6)', 'Grupo · RPBC Laboratório (9)', 'Ana Ribeiro', 'Carlos Mendes', 'Beatriz Lima', 'Rafael Souza', 'Marina Costa'];

const ENS = {
  comb: [
    { n: 'Massa específica a 20 °C', m: 'D-4052', u: 'kg/m³', min: 715, max: 770, base: 745, sd: 9, dec: 1 },
    { n: 'Enxofre total', m: 'D-5453', u: 'mg/kg', max: 50, base: 33, sd: 7, dec: 0 },
    { n: 'Destilação · PFE', m: 'D-86', u: '°C', max: 215, base: 199, sd: 6, dec: 1 },
    { n: 'Água (Karl Fischer)', m: 'D-6304', u: 'mg/kg', max: 200, base: 150, sd: 24, dec: 0 }
  ],
  corr: [
    { n: 'pH', m: 'SM-4500 H', u: '', min: 6, max: 9, base: 7.5, sd: .55, dec: 2 },
    { n: 'Sulfeto', m: 'SM-4500 S', u: 'mg/L', max: 1, base: .55, sd: .18, dec: 2 },
    { n: 'NH₃', m: 'SM-4500 NH3', u: 'mg/L', max: 20, base: 13, sd: 3.4, dec: 1 },
    { n: 'Água e sedimento', m: 'D-1796', u: '% vol', max: .05, base: .028, sd: .009, dec: 3 }
  ]
};
const conjunto = c => /^(M|0|2)/.test((c.filtros.produto[0] || '620').split(' ')[0]) ? 'corr' : 'comb';
const specTxt = e => e.min != null && e.max != null ? `${fmtN(e.min, e.dec > 1 ? 1 : 0)}–${fmtN(e.max, e.dec > 1 ? 1 : 0)}` : e.max != null ? `≤ ${String(e.max).replace('.', ',')}` : `≥ ${e.min}`;
function stValor(e, v) {
  if ((e.min != null && v < e.min) || (e.max != null && v > e.max)) return 'fora';
  if (e.max != null && v > e.max - Math.abs(e.max) * .03) return 'atencao';
  if (e.min != null && v < e.min + Math.abs(e.min) * .03) return 'atencao';
  return 'ok';
}
const stRow = (set, row) => { const s = set.map((e, i) => stValor(e, row.vals[i])); return s.includes('fora') ? 'fora' : s.includes('atencao') ? 'atencao' : 'ok'; };
const stBadge = (st, curto) => st === 'fora' ? `<span class="st st-danger">${icon('alert')}${curto ? 'Fora<span class="sr"> de especificação</span>' : 'Fora de especificação'}</span>` : st === 'atencao' ? `<span class="st st-warn">${icon('info')}Atenção</span>` : `<span class="st st-ok">${icon('check')}Conforme</span>`;

/* ---------- ícones de status (frasco = amostra, Erlenmeyer = método, bloco = equipamento) ---------- */
const FORMA = {
  flask: { d: 'M12.5 4h7v8.2l7.6 13.2A2.4 2.4 0 0 1 25 29H7a2.4 2.4 0 0 1-2.1-3.6l7.6-13.2z', nivel: { vazio: null, terco: 22.5, dois: 17.5, cheio: 12.3 } },
  bottle: { d: 'M12.5 6h7v2.5l2.6 1.5a2.5 2.5 0 0 1 1.4 2.2v14.3a2.5 2.5 0 0 1-2.5 2.5H11a2.5 2.5 0 0 1-2.5-2.5V12.2a2.5 2.5 0 0 1 1.4-2.2l2.6-1.5z', nivel: { vazio: null, terco: 23, dois: 17.5, cheio: 11.2 } }
};
const SPEC = {
  ok: { cor: 'var(--ok)', st: 'st-ok', ic: 'check', txt: 'Conforme', g: '<path d="m22.4 25.2 1.8 1.8 3.5-3.7"/>' },
  fora: { cor: 'var(--danger)', st: 'st-danger', ic: 'alert', txt: 'Fora de especificação', g: '<path d="M25 21.9v3.5"/><path d="M25 28.1h.01"/>' },
  sem: { cor: 'var(--purple)', st: 'st-purple', ic: 'help', txt: 'Sem especificação', g: '<path d="M23.3 23.5a1.8 1.8 0 1 1 2.5 1.7c-.4.2-.8.5-.8.9"/><path d="M25 28.3h.01"/>' }
};
function svgFrasco(tipo, e, spec, s = 28, title = '') {
  const f = FORMA[tipo], y = f.nivel[e.nivel];
  const liq = y == null ? '' : `<rect x="0" y="${y}" width="32" height="${32 - y}" fill="var(--liquid)" stroke="none" clip-path="url(#clip-${tipo})"/>`;
  const bolhas = e.bolhas ? '<circle cx="13.5" cy="26" r="1.1" fill="var(--surface)" stroke="none"/><circle cx="17.5" cy="24.4" r=".8" fill="var(--surface)" stroke="none"/><circle cx="15.6" cy="27.3" r=".6" fill="var(--surface)" stroke="none"/>' : '';
  const seta = e.seta ? '<path d="M10 23.5h10m-3.2-3.2 3.2 3.2-3.2 3.2" stroke="var(--surface)" stroke-width="2.2"/>' : '';
  const tampa = tipo === 'bottle'
    ? `<rect x="11.5" y="2" width="9" height="4" rx="1" fill="${e.tampa ? 'var(--fg)' : 'var(--surface)'}" ${e.tampa ? 'stroke="var(--fg)"' : ''}/>`
    : `<path d="M11.2 4h9.6"/>${e.tampa ? '<rect x="12.3" y=".6" width="7.4" height="4.6" rx="1.3" fill="var(--fg)" stroke="var(--fg)"/>' : ''}`;
  const marca = spec ? `<circle cx="25" cy="25" r="6.3" fill="${SPEC[spec].cor}" stroke="var(--surface)" stroke-width="1.6"/><g stroke="#fff" stroke-width="1.9">${SPEC[spec].g}</g>` : '';
  return `<svg class="si" width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" stroke="var(--fg-2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${liq}${bolhas}${seta}<path d="${f.d}"/>${tampa}${marca}</svg>`;
}
const ETAPAS_AMOSTRA = {
  disponivel: { n: 'Disponível', nivel: 'vazio', d: 'Aguardando resultados' },
  entrada: { n: 'Em entrada', nivel: 'terco', d: 'Parte dos resultados registrada' },
  entrados: { n: 'Resultados entrados', nivel: 'dois', d: 'Todos registrados ou modificados' },
  concluida: { n: 'Concluída', nivel: 'cheio', d: 'Análises encerradas' },
  autorizada: { n: 'Autorizada', nivel: 'cheio', tampa: true, d: 'Liberada pelo responsável' }
};
const ETAPAS_METODO = {
  disponivel: { n: 'Disponível', nivel: 'vazio', d: 'Aguardando entrada de dados' },
  analise: { n: 'Em análise', nivel: 'terco', bolhas: true, d: 'Ensaio em andamento' },
  transito: { n: 'Em trânsito', nivel: 'dois', seta: true, d: 'Aprovado no triLAB, indo para o LIMS' },
  entrados: { n: 'Resultados entrados', nivel: 'cheio', d: 'Todos registrados ou modificados' },
  autorizado: { n: 'Autorizado', nivel: 'cheio', tampa: true, d: 'Resultados liberados' }
};
const LEG_AMOSTRA = [
  ['Amostra disponível para entrada de dados', 'disponivel'],
  ['Amostra com resultados entrados ou modificados', 'entrados'],
  ['Amostra disponível fora de especificação', 'entrada', 'fora'],
  ['Amostra concluída', 'concluida'],
  ['Amostra concluída fora de especificação', 'concluida', 'fora'],
  ['Amostra autorizada dentro da especificação', 'autorizada', 'ok'],
  ['Amostra autorizada fora de especificação', 'autorizada', 'fora'],
  ['Amostra autorizada faltando especificação', 'autorizada', 'sem']
];
const LEG_METODO = [
  ['Disponível para entrada de dados', 'disponivel'],
  ['Com resultados em análise', 'analise'],
  ['Com resultados aprovados no triLAB, mas ainda em trânsito para o LIMS', 'transito'],
  ['Com todos os resultados entrados ou modificados', 'entrados'],
  ['Com todos os resultados entrados ou modificados fora de especificação', 'entrados', 'fora'],
  ['Com resultados autorizados dentro da especificação', 'autorizado', 'ok'],
  ['Com resultados autorizados fora da especificação', 'autorizado', 'fora']
];
const EQUIP = {
  disponivel: { n: 'Disponível', cor: 'ok', d: 'Pronto para uso.', g: '<path d="m6.5 12.5 3.6 3.6 7.4-8"/>' },
  ocupado: { n: 'Ocupado', cor: 'info', d: 'Em uso normal. Mostra quando fica livre.', g: '<circle cx="12" cy="12" r="7.5"/><path d="M12 8v4.2l2.7 1.8"/>' },
  edicao: { n: 'Em edição', cor: 'warn', d: 'Cadastro ou ajuste em andamento.', g: '<path d="M6 18h3.3l8.4-8.4-3.3-3.3L6 14.7z"/><path d="m12.8 8 3.3 3.3"/>' },
  fora: { n: 'Fora de uso', cor: 'danger', d: 'Não pode ser usado. Mostra o motivo.', g: '<circle cx="12" cy="12" r="7.5"/><path d="m6.7 6.7 10.6 10.6"/>' }
};
const LEG_EQUIP = [
  ['Equipamento disponível', 'disponivel'], ['Equipamento disponível com resultado finalizado', 'disponivel', 1],
  ['Equipamento em edição', 'edicao'], ['Equipamento em edição com resultado finalizado', 'edicao', 1],
  ['Equipamento fora de uso', 'fora'], ['Equipamento fora de uso com resultado finalizado', 'fora', 1],
  ['Equipamento ocupado', 'ocupado'], ['Equipamento ocupado com resultado finalizado', 'ocupado', 1]
];
const svgEquip = (k, s = 28) => { const e = EQUIP[k]; return `<svg class="si" width="${s}" height="${s}" viewBox="0 0 32 32" role="img" aria-label="${e.n}"><title>${e.n}</title><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--${e.cor}-subtle)"/><g transform="translate(4 4)" fill="none" stroke="var(--${e.cor})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${e.g}</g></svg>`; };
const specBadge = s => s ? `<span class="st ${SPEC[s].st}">${icon(SPEC[s].ic)}${SPEC[s].txt}</span>` : '';
function sampCell(r, set, curto) {
  const st = stRow(set, r), spec = st === 'fora' ? 'fora' : r.etapa === 'autorizada' ? 'ok' : null, e = ETAPAS_AMOSTRA[r.etapa];
  return `<td class="samp"><div class="samp-wrap">${svgFrasco('bottle', e, spec, 26, e.n + (spec ? ' · ' + SPEC[spec].txt : ''))}<div><b>${r.amostra}</b><span>${curto ? '' : esc(r.produto.split(' · ')[1]) + ' · '}${e.n}</span></div></div></td>`;
}

function novaLinha(r, set, prods, i, t) {
  const locais = set === ENS.corr ? ['UP-MLG', 'Linha 16', 'ETDI', 'Píer 2'] : ['TQ-4101', 'TQ-4102', 'Píer 2', 'Oleoduto OSVAT'];
  const clientes = ['EXT', 'INT', 'ABAST', 'GLPT'], fins = ['Controle de processo', 'Certificação', 'Liberação de tanque'];
  const vals = set.map(e => { let v = e.base + gauss(r) * e.sd; if (r() < .055) v = (e.max ?? v) + e.sd * (.4 + r()); return +v.toFixed(e.dec); });
  const x = r(), etapa = x < .6 ? 'autorizada' : x < .85 ? 'concluida' : 'entrados';
  return { amostra: 5029000 + Math.floor(r() * 9000), produto: prods[i % prods.length], data: new Date(t), local: locais[Math.floor(r() * locais.length)], cliente: clientes[Math.floor(r() * 4)], finalidade: fins[Math.floor(r() * 3)], vals, etapa };
}
function gerar(c, ate, seed) {
  const r = rng(seed), set = ENS[conjunto(c)];
  const prods = c.filtros.produto.length ? c.filtros.produto : ['620 · Gasolina A'];
  const n = c.modo === 'online' ? 10 : 16;
  let t = new Date(ate); if (isoLocal(t) === isoLocal(HOJE)) t = new Date(HOJE); else t.setHours(18, 0, 0, 0);
  const rows = [];
  for (let i = 0; i < n; i++) { t = new Date(t.getTime() - (1.5 + r() * 18) * 3600e3); rows.push(novaLinha(r, set, prods, i, t)); }
  let out = rows;
  if (c.espec === 'fora') out = rows.filter(x => stRow(set, x) === 'fora');
  if (c.espec === 'dentro') out = rows.filter(x => stRow(set, x) !== 'fora');
  return { set, rows: out, r };
}

/* ---------- estado ---------- */
function base() {
  return {
    modo: 'analitico', periodo: { tipo: 'relativa', dias: 90, de: '', ate: '' },
    filtros: Object.fromEntries(FILTROS.map(f => [f.key, []])), perguntar: Object.fromEntries(FILTROS.map(f => [f.key, false])),
    situacao: 'ativa', espec: 'todas', testemunho: false, agrupar: 'solicitante',
    nome: '', descricao: '', compartilhar: 'eu', com: [], fixar: false, envio: ''
  };
}
function mk(o) { const b = base(); return { ...b, ...o, periodo: { ...b.periodo, ...(o.periodo || {}) }, filtros: { ...b.filtros, ...(o.filtros || {}) }, perguntar: { ...b.perguntar, ...(o.perguntar || {}) } }; }

const S = {
  usuario: 'José da Silva', orgao: '275',
  consultas: [
    mk({ id: 1, nome: 'Gasolina A · rotina diária', filtros: { produto: ['620 · Gasolina A'] }, dono: 'eu', fixar: true, compartilhar: 'grupos', com: ['Grupo · Recap Laboratório (12)'], ultima: em(8, 12) }),
    mk({ id: 2, nome: 'Gases com filtros variáveis', filtros: { produto: ['200 · Gás combustível', '203 · Gás ácido'] }, perguntar: { cliente: true, finalidade: true, metodo: true }, dono: 'eu', compartilhar: 'grupos', com: ['Grupo · Recap Laboratório (12)'], ultima: em(17, 40, 1) }),
    mk({ id: 3, nome: 'Correntes · período variável', filtros: { produto: ['M01 · Corrente: gás de combustão', 'M02 · Corrente: gás de processo', 'M09 · Corrente: água ácida tratada', 'M12 · Corrente: água contaminada', 'M20 · Corrente: despejo industrial'], metodo: ['D-1796 · Água e sedimento', 'D-86 · Destilação'] }, periodo: { tipo: 'variavel' }, dono: 'Ana Ribeiro', compartilhar: 'grupos', com: ['Grupo · Equipe iLab (6)'], ultima: em(10, 5, 3) }),
    mk({ id: 4, nome: 'Certificados Marine', modo: 'certificado', filtros: { produto: ['709 · Marine Fuel 30', '708 · Marine Diesel Oil'] }, periodo: { dias: 15 }, dono: 'eu', fixar: true, envio: 'Envio de CE', ultima: em(9, 30, 2) }),
    mk({ id: 5, nome: 'Petróleo · desvios da semana', modo: 'desvio', filtros: { produto: ['140 · Petróleo nacional mistura'] }, periodo: { dias: 7 }, dono: 'Carlos Mendes', compartilhar: 'grupos', com: ['Grupo · Recap Laboratório (12)'], ultima: em(7, 40) }),
    mk({ id: 6, nome: 'Gasolina A · acompanhamento on-line', modo: 'online', filtros: { produto: ['620 · Gasolina A'] }, periodo: { dias: 1 }, dono: 'eu', fixar: true, ultima: em(7, 55) }),
    mk({ id: 7, nome: 'Gasolina A · estatística mensal', modo: 'estatistico', filtros: { produto: ['620 · Gasolina A'] }, periodo: { dias: 30 }, dono: 'eu', ultima: null })
  ],
  nextId: 8, seq: 0,
  draft: null, exec: null, dlg: null,
  abas: [], abaAtiva: null, comparar: false, compararCom: null,

function executar(id) {
  const c = byId(id); if (!c) return;
  if (perguntas(c).length) {
    S.exec = { id: c.id, filtros: clone(c.filtros), de: isoLocal(addDias(HOJE, -7)), ate: isoLocal(HOJE), erro: null };
    S.dlg = { type: 'exec' }; renderDlg();

function rodar(c, params) {
  let de, ate;
  if (params.de) { de = parseIso(params.de); ate = parseIso(params.ate); }
  else if (c.periodo.tipo === 'fixa' && c.periodo.de) { de = parseIso(c.periodo.de); ate = parseIso(c.periodo.ate); }
  else { ate = new Date(HOJE); de = addDias(HOJE, -(+c.periodo.dias || 90)); }
  const dias = Math.round((ate - de) / 864e5);
  const cc = params.filtros ? { ...c, filtros: params.filtros } : c;
  c.ultima = new Date();
  const ptxt = `${fmtData(de)} – ${fmtData(ate)}`;
  if (dias > 180) {
    const proc = { nome: c.nome }; S.processos.push(proc); renderTop();
    toast('Período longo: processando em segundo plano', { tipo: 'info', sub: `${dias} dias de dados. O sino avisa quando terminar.`, ms: 6000 });
    setTimeout(() => {
      S.processos = S.processos.filter(p => p !== proc);
      const key = abrirAba(cc, ate, ptxt);
      S.notifs.unshift({ txt: `Resultado de “${c.nome}” pronto`, t: new Date(), lida: false, aba: key });
      toast('Resultado pronto', { sub: c.nome, acao: { label: 'Abrir', fn: () => { S.abaAtiva = key; go('#/resultados'); } }, ms: 8000 });
      render();
    }, 4500);
    return;
  }
  const aberta = S.abas.find(a => a.sig === assinatura(cc, ptxt));
  if (aberta) {
    const g = gerar(aberta.c, ate, c.id * 1000 + (++S.seq));
    Object.assign(aberta, { set: g.set, rows: g.rows, r: g.r, gerado: new Date() });
    if (aberta.key !== S.compararCom) S.abaAtiva = aberta.key;
    toast('Resultado atualizado', { sub: 'Essa consulta já estava aberta nesta aba.', ms: 3000 });
    go('#/resultados');
    return;
  }
  abrirAba(cc, ate, ptxt);
  S.comparar = S.comparar && S.abas.length > 1;
  go('#/resultados');
}
const assinatura = (c, ptxt) => JSON.stringify([c.id, ptxt, c.filtros]);
function abrirAba(c, ate, ptxt) {
  const key = 'r' + (++S.seq), orig = byId(c.id) || c;
  orig.runs = (orig.runs || 0) + 1;
  const g = gerar(c, ate, c.id * 1000 + orig.runs);
  S.abas.push({ key, sig: assinatura(c, ptxt), titulo: c.nome, modo: c.modo, ptxt, c: clone({ ...c, ultima: null }), set: g.set, rows: g.rows, r: g.r, gerado: new Date(), so: false });
  if (S.comparar) S.compararCom = key; else S.abaAtiva = key;

}

function spark(v, e) {

  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Tendência de ${esc(e.n)}">${e.max != null ? `<line x1="0" x2="${w}" y1="${y(e.max)}" y2="${y(e.max)}" stroke="var(--danger)" stroke-dasharray="3 3" stroke-width="1"/>` : ''}<polyline points="${pts}" fill="none" stroke="var(--fg-2)" stroke-width="1.75" stroke-linejoin="round"/></svg>`;
}

  cert() {
    const a = S.abas.find(a => a.key === S.dlg.key), r = a.rows[S.dlg.i], ok = stRow(a.set, r) !== 'fora';
    return `<div class="dlg-head"><div><h2>Certificado de ensaio</h2><p>Pré-visualização do documento enviado ao cliente.</p></div><button class="icon-btn" data-action="dlg-close" aria-label="Fechar">${icon('x')}</button></div>
      <div class="dlg-body"><div class="cert">
        <div class="cert-head"><div><b>CE-${r.data.getFullYear()}-${String(r.amostra).slice(-5)}</b><div class="muted small">Laboratório ${esc(orgNome())}</div></div>${ok ? stBadge('ok') : stBadge('fora')}</div>
        <div class="cert-grid"><div><span>Produto</span>${esc(r.produto)}</div><div><span>Amostra</span>${r.amostra}</div><div><span>Coletada em</span>${fmtDH(r.data)}</div><div><span>Cliente</span>${esc(r.cliente)}</div></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Ensaio</th><th scope="col">Método</th><th scope="col" class="num">Resultado</th><th scope="col" class="num">Especificação</th><th scope="col">Situação</th></tr></thead><tbody>
          ${a.set.map((e, i) => { const st = stValor(e, r.vals[i]); return `<tr><td>${esc(e.n)}</td><td>${esc(e.m)}</td><td class="num v-${st}">${st === 'fora' ? icon('alert') : ''}${fmtN(r.vals[i], e.dec)} ${esc(e.u)}</td><td class="num">${esc(specTxt(e))}</td><td>${stBadge(st, true)}</td></tr>`; }).join('')}
        </tbody></table></div></div>
        ${ok ? '' : `<div class="note warn">${icon('alert')}<span>Esta amostra tem resultado fora de especificação. Confira antes de enviar ao cliente.</span></div>`}</div>
      <div class="dlg-foot"><button class="btn" data-action="print">${icon('print')}Imprimir</button><button class="btn btn-primary" data-action="enviar" data-key="${a.key}" data-i="${S.dlg.i}">${icon('mail')}Enviar por e-mail</button></div>`;
  },
  enviar() {
    const a = S.abas.find(a => a.key === S.dlg.key), r = a.rows[S.dlg.i], d = S.dlg;
    return `<div class="dlg-head"><div><h2>Enviar certificado</h2><p>Amostra ${r.amostra} · ${esc(r.produto.split(' · ')[1])}</p></div><button class="icon-btn" data-action="dlg-close" aria-label="Fechar">${icon('x')}</button></div>
      <div class="dlg-body"><div><span class="lbl">Para</span>${renderPicker('enviar:para', 'Grupo ou e-mail')}${d.erro ? `<p class="err-msg">${icon('alert')}${d.erro}</p>` : '<p class="hint below">Escolha um grupo ou digite um e-mail e pressione Enter.</p>'}</div>
        <label><span class="lbl">Mensagem <span class="muted fw-400">(opcional)</span></span><textarea class="inp" data-bind="msg" data-scope="dlg">${esc(d.msg)}</textarea></label></div>
      <div class="dlg-foot"><button class="btn btn-ghost" data-action="dlg-close">Cancelar</button><button class="btn btn-primary" data-action="enviar-ok">${icon('mail')}Enviar</button></div>`;
  },
  grupo() {
    const d = S.dlg;
    return `<div class="dlg-head"><div><h2>Novo grupo</h2><p>Para compartilhar consultas ou enviar certificados de uma vez.</p></div><button class="icon-btn" data-action="dlg-close" aria-label="Fechar">${icon('x')}</button></div>
      <div class="dlg-body"><label><span class="lbl">Nome do grupo</span><input class="inp ${d.erros.nome ? 'err' : ''}" data-bind="nome" data-scope="dlg" value="${esc(d.nome)}" placeholder="Ex.: Clientes Marine"></label>${d.erros.nome ? `<p class="err-msg tight">${icon('alert')}${d.erros.nome}</p>` : ''}
        <div><span class="lbl">E-mails</span>${renderPicker('grupo:membros', 'nome@empresa.com.br')}${d.erros.membros ? `<p class="err-msg">${icon('alert')}${d.erros.membros}</p>` : '<p class="hint below">Digite cada e-mail e pressione Enter. Pode colar vários separados por vírgula.</p>'}</div></div>
      <div class="dlg-foot"><button class="btn btn-ghost" data-action="dlg-close">Cancelar</button><button class="btn btn-primary" data-action="grupo-ok">Criar grupo</button></div>`;
  }
};
function renderDlg() {
  const dl = $('#dlg');
  if (!S.dlg) { if (dl.open) dl.close(); return; }
  dl.className = 'dlg' + (S.dlg.type === 'cert' ? ' wide' : '');
  dl.innerHTML = DLG[S.dlg.type]();
  if (!dl.open) dl.showModal();
}
$('#dlg').addEventListener('close', () => { S.dlg = null; S.picker = null; });
function fecharDlg() { S.dlg = null; renderDlg(); }

/* ---------- tabelas responsivas ----------
   No celular cada linha vira um card (como o pop-in da tabela responsiva do SAP Fiori):
   a 1ª coluna é o título do card e as demais aparecem como "rótulo: valor".
   O rótulo de cada célula vem do cabeçalho da coluna. */
function rotularTabelas(root) {
  root.querySelectorAll('table.tbl:not([data-rot])').forEach(t => {
    const cols = [...t.querySelectorAll('thead th')].map(th => {
      const sub = th.querySelector('.th-sub');
      return { l: [...th.childNodes].filter(n => n !== sub).map(n => n.textContent).join('').trim(), s: sub?.textContent.trim() || '' };
    });
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
      if (!cols[i]) return; td.dataset.label = cols[i].l; if (cols[i].s) td.dataset.sub = cols[i].s;
    }));
    t.dataset.rot = '';
  });
}
['#view', '#dlg'].forEach(s => new MutationObserver(() => rotularTabelas($(s))).observe($(s), { childList: true, subtree: true }));

/* ---------- render ---------- */
function renderView() {
  const r = route().p;
  const V = { inicio: vInicio, consultas: vConsultas, nova: vWizard, editar: vWizard, resultados: vResultados, ajustes: vAjustes, status: vStatus }[r] || vInicio;
  if ((r === 'nova' || r === 'editar') && !S.draft) S.draft = novoDraft();
  if (r === 'ajustes' && !S.aj) S.aj = clone(S.ajustes);
  $('#view').innerHTML = V();
  document.title = `iLab · ${TITULOS[r] || 'Minhas consultas'}`;
  atualizarRolagem();
}
/* tabela mais larga que o painel: fixa a 1ª coluna com divisória e oferece o botão "Mais colunas" */
function atualizarRolagem() {
  document.querySelectorAll('.pane').forEach(p => {
    const w = p.querySelector('.tbl-wrap'), b = p.querySelector('.scroll-hint'); if (!w || !b) return;
    const sobra = w.scrollWidth > w.clientWidth + 1;
    w.classList.toggle('scrolls', sobra);
    b.hidden = !sobra || w.scrollLeft + w.clientWidth >= w.scrollWidth - 1;
  });
}
document.addEventListener('scroll', e => { if (e.target.classList?.contains('tbl-wrap')) atualizarRolagem(); }, true);
addEventListener('resize', atualizarRolagem);
function render() { renderSide(); renderTop(); renderView(); renderHelp(); }

/* ---------- eventos ---------- */
function setPath(o, path, v) { const k = path.split('.'); let t = o; k.slice(0, -1).forEach(p => t = t[p]); t[k[k.length - 1]] = v; }
const scopeObj = s => ({ draft: S.draft, exec: S.exec, aj: S.aj, dlg: S.dlg }[s]);
const ACTIONS = {
  'nav-toggle': () => nav(!$('#sidebar').classList.contains('open')),
  help: () => { S.help = !S.help; renderHelp(); renderTop(); },
  notif: () => { S.notifOpen = !S.notifOpen; renderTop(); },
  'notif-open': d => { const n = S.notifs[+d.i]; n.lida = true; S.notifOpen = false; renderTop(); if (n.run) executar(n.run); else if (n.aba) { S.abaAtiva = n.aba; go('#/resultados'); } else if (n.go) go(n.go); },
  run: d => executar(+d.id),
  fav: d => { const c = byId(d.id); c.fixar = !c.fixar; toast(c.fixar ? 'Fixada na tela inicial' : 'Removida da tela inicial', { sub: c.nome, ms: 2500 }); renderView(); },
  menu: d => { S.menu = S.menu === +d.id ? null : +d.id; renderView(); },
  edit: d => go('#/editar/' + d.id),
  share: d => { S.pendingStep = 3; go('#/editar/' + d.id); },
  dup: d => { const c = byId(d.id), id = S.nextId++; S.consultas.unshift({ ...clone({ ...c, ultima: null }), id, nome: c.nome + ' (cópia)', dono: 'eu', fixar: false, compartilhar: 'eu', com: [], ultima: null }); S.menu = null; S.destaque = id; S.filtroLista = 'todas'; renderView(); toast('Consulta duplicada', { sub: 'A cópia é sua. Pode editar à vontade.', acao: { label: 'Editar', fn: () => go('#/editar/' + id) } }); setTimeout(() => S.destaque = null, 2500); },
  del: d => { S.menu = null; renderView(); S.dlg = { type: 'del', id: +d.id }; renderDlg(); },
  'del-ok': () => { const c = byId(S.dlg.id), copia = { ...c }, idx = S.consultas.indexOf(c); S.consultas.splice(idx, 1); fecharDlg(); renderView(); toast(c.dono === 'eu' ? 'Consulta excluída' : 'Removida da sua lista', { sub: c.nome, acao: { label: 'Desfazer', fn: () => { S.consultas.splice(idx, 0, copia); renderView(); } } }); },
  sort: d => {
    const o = S.ordem;
    if (o.k !== d.k) S.ordem = { k: d.k, dir: 1 }; else if (o.dir > 0) o.dir = -1; else S.ordem = { k: null, dir: 1 };
    $('#qlist').innerHTML = renderLista(filtradas());
    document.querySelector(`[data-action="sort"][data-k="${d.k}"]`)?.focus();
  },
  'scroll-more': (d, el) => { el.closest('.pane').querySelector('.tbl-wrap').scrollBy({ left: 240, behavior: 'smooth' }); },
  'lista-filtro': d => { S.filtroLista = d.v; renderView(); },
  'limpar-filtros': () => { S.filtroLista = 'todas'; S.busca = ''; S.modoFiltro = ''; renderView(); },
  set: d => {
    const o = scopeObj(d.scope); let v = d.v; if (/^\d+$/.test(v) && d.path.endsWith('dias')) v = +v;
    setPath(o, d.path, v);
    if (d.scope === 'draft') { if (d.path === 'periodo.tipo') S.draft.erros = {}; renderView(); } else renderDlg();
  },
  step: d => { const n = +d.n; if (n === 3 && S.draft.step <= 2 && !validaPasso2()) { S.draft.step = 2; renderView(); return; } S.draft.step = n; S.draft.erros = {}; renderView(); window.scrollTo(0, 0); },
  'wiz-next': () => { if (S.draft.step === 2 && !validaPasso2()) { renderView(); return; } S.draft.step++; renderView(); window.scrollTo(0, 0); },
  'wiz-back': () => { S.draft.step--; S.draft.erros = {}; renderView(); window.scrollTo(0, 0); },
  'wiz-cancel': () => { S.draft = null; go('#/consultas'); },
  'wiz-save': () => salvarDraft(),
  'mais-filtros': () => { S.draft.maisFiltros = !S.draft.maisFiltros; renderView(); },
  preview: () => { if (!validaPasso2()) { renderView(); return; } const g = gerar({ ...S.draft, id: 99 }, HOJE, 99000 + (++S.seq)); S.draft.preview = g; renderView(); setTimeout(() => document.querySelector('.fcard:has(.tbl)')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }), 30); },
  'preview-close': () => { S.draft.preview = null; renderView(); },
  'pick-add': d => pickAdd(d.id, d.v),
  'pick-remove': d => { pickerRef(d.id).list.splice(+d.i, 1); refreshPicker(d.id); if (d.id.startsWith('share')) updateResumo(); },
  'exec-quick': d => { S.exec.ate = isoLocal(HOJE); S.exec.de = isoLocal(addDias(HOJE, -(+d.n))); S.exec.erro = null; renderDlg(); },
  'exec-ok': () => {
    const x = S.exec, c = byId(x.id);
    if (c.periodo.tipo === 'variavel') {
      if (!x.de || !x.ate) { x.erro = 'Preencha as duas datas.'; renderDlg(); return; }
      if (x.de > x.ate) { x.erro = 'A data inicial precisa ser anterior à final.'; renderDlg(); return; }
    }
    const params = { filtros: x.filtros, ...(c.periodo.tipo === 'variavel' ? { de: x.de, ate: x.ate } : {}) };
    fecharDlg(); S.exec = null; rodar(c, params);
  },
  'dlg-close': () => fecharDlg(),
  tab: (d, el, e) => { if (e.target.closest('.tclose')) return; if (S.comparar && d.key !== S.abaAtiva) S.compararCom = d.key === S.compararCom ? S.compararCom : d.key; else S.abaAtiva = d.key; renderView(); },
  'tab-close': d => { S.abas = S.abas.filter(a => a.key !== d.key); if (S.abaAtiva === d.key) S.abaAtiva = S.abas[S.abas.length - 1]?.key || null; if (S.compararCom === d.key) S.compararCom = null; if (S.abas.length < 2) S.comparar = false; render(); },
  comparar: () => { S.comparar = !S.comparar; renderView(); },
  'aba-so': d => { S.abas.find(a => a.key === d.key).so = d.v === '1'; renderView(); },
  rerun: d => { const a = S.abas.find(a => a.key === d.key); const c = byId(a.c.id) || a.c; const g = gerar(a.c, HOJE, a.c.id * 1000 + (++S.seq)); Object.assign(a, { set: g.set, rows: g.rows, gerado: new Date() }); if (byId(a.c.id)) c.ultima = new Date(); renderView(); toast('Resultado atualizado', { ms: 2500 }); },
  export: d => exportar(S.abas.find(a => a.key === d.key)),
  print: () => window.print(),
  cert: d => { S.dlg = { type: 'cert', key: d.key, i: +d.i }; renderDlg(); },
  enviar: d => { const a = S.abas.find(a => a.key === d.key); S.dlg = { type: 'enviar', key: d.key, i: +d.i, para: a.c.envio ? ['Grupo · Envio de CE (5)'] : [], msg: '', erro: null }; renderDlg(); },
  'enviar-ok': () => { const d = S.dlg; if (!d.para.length) { d.erro = 'Escolha pelo menos um destinatário.'; renderDlg(); return; } const n = d.para.reduce((s, p) => s + (p.startsWith('Grupo') ? 5 : 1), 0); fecharDlg(); toast(`Certificado enviado para ${n} destinatário${n > 1 ? 's' : ''}`, { sub: 'Uma cópia fica no histórico da amostra.' }); },
  'grupo-novo': () => { S.dlg = { type: 'grupo', nome: '', membros: [], erros: {} }; renderDlg(); },
  'grupo-ok': () => { const d = S.dlg; d.erros = {}; if (!d.nome.trim()) d.erros.nome = 'Dê um nome ao grupo.'; if (!d.membros.length) d.erros.membros = 'Adicione pelo menos um e-mail.'; if (Object.keys(d.erros).length) { renderDlg(); return; } S.grupos.push({ nome: d.nome.trim(), tipo: 'E-mails externos', membros: [...d.membros] }); fecharDlg(); renderView(); toast('Grupo criado', { sub: `${d.nome.trim()} · ${d.membros.length} e-mails` }); },
  'aj-save': () => { S.ajustes = clone(S.aj); renderView(); toast('Ajustes salvos'); },
  'aj-reset': () => { S.aj = clone(S.ajustes); renderView(); },
  'toast-act': (d, el) => { S.toastFns[d.t]?.(); el.closest('.toast')?.remove(); }
};
document.addEventListener('click', e => {
  // menu no celular: toque fora (no fundo escuro) ou em qualquer link dele fecha
  if ($('#sidebar').classList.contains('open') && !e.target.closest('.menu-btn') && (!e.target.closest('#sidebar') || e.target.closest('#sidebar a'))) nav(false);
  const a = e.target.closest('[data-action]');
  if (S.picker && !e.target.closest('.picker')) { const id = S.picker; S.picker = null; refreshPicker(id); }
  let need = false;
  if (S.menu != null && !e.target.closest('.menu-wrap')) { S.menu = null; need = true; }
  if (S.notifOpen && !e.target.closest('.notif-wrap')) { S.notifOpen = false; renderTop(); }
  if (!a) {
    const pk = e.target.closest('.picker-box'); if (pk) pk.querySelector('input').focus();
    if (need) renderView();
    return;
  }
  if (a.tagName === 'INPUT' && a.type === 'radio') { /* radios: deixa marcar e re-renderiza */ }
  else if (a.tagName !== 'A') e.preventDefault();
  ACTIONS[a.dataset.action]?.(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches?.('.tab, .tclose') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
  if (t.dataset?.pickerInput) {
    const id = t.dataset.pickerInput, ref = pickerRef(id);
    if (e.key === 'Enter') {
      e.preventDefault(); const q = t.value.trim(), m = pickerMatches(id);
      if (ref.livre && q) q.split(/[,;\s]+/).filter(Boolean).forEach(v => pickAdd(id, v));
      else if (m[0]) pickAdd(id, m[0]);
    } else if (e.key === 'Backspace' && !t.value && ref.list.length) { ref.list.pop(); refreshPicker(id, true); }
    else if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); S.picker = null; refreshPicker(id, true); }
  }
  if (e.key === 'Escape' && $('#sidebar').classList.contains('open')) { nav(false); $('.menu-btn')?.focus(); }
  if (e.key === 'Escape' && S.help && !S.dlg) { S.help = false; renderHelp(); renderTop(); }
});
document.addEventListener('focusin', e => {
  const id = e.target.dataset?.pickerInput;
  if (id && S.picker !== id) { const prev = S.picker; S.picker = id; if (prev) refreshPicker(prev); refreshPicker(id, true); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pickerInput) { const id = t.dataset.pickerInput; S.pq[id] = t.value; S.picker = id; refreshPicker(id, true); return; }
  if (t.matches('[data-busca]')) { S.busca = t.value; $('#qlist').innerHTML = renderLista(filtradas()); return; }
  if (t.dataset.bind && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    const s = t.dataset.scope; setPath(scopeObj(s), t.dataset.bind, t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.value);
    if (s === 'draft') { if (S.draft.erros[t.dataset.bind === 'nome' ? 'nome' : 'x']) { S.draft.erros = {}; } updateResumo(); }
    if (s === 'exec') { const x = S.exec; x.erro = null; const h = $('#exec-hint'); if (h) { const dias = x.de && x.ate ? Math.round((parseIso(x.ate) - parseIso(x.de)) / 864e5) : 0; h.innerHTML = dias > 180 ? `<div class="note warn">${icon('clock')}<span>${dias} dias é um período longo. A consulta vai rodar em segundo plano e o sino avisa quando terminar.</span></div>` : ''; } }
    if (s === 'aj') { const pos = t.selectionStart; const name = t.dataset.bind; renderView(); const n = document.querySelector(`[data-bind="${name}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { } } }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-org]')) { S.orgao = t.value; toast(`Você está vendo dados de ${orgNome()}`, { tipo: 'info', ms: 3000 }); render(); return; }
  if (t.matches('[data-modo-filtro]')) { S.modoFiltro = t.value; $('#qlist').innerHTML = renderLista(filtradas()); return; }
  if (t.matches('[data-cmp]')) { S.compararCom = t.value; renderView(); return; }
  if (t.dataset.bind && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
    const s = t.dataset.scope; setPath(scopeObj(s), t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
    if (s === 'draft') updateResumo(); if (s === 'aj') renderView();
  }
});

/* resultados on-line: chega uma amostra nova a cada 15 s */
setInterval(() => {
  let mudou = false;
  S.abas.filter(a => a.modo === 'online').forEach(a => {
    a.rows.forEach(r => delete r.novo);
    const prods = a.c.filtros.produto.length ? a.c.filtros.produto : ['620 · Gasolina A'];
    const r = novaLinha(a.r, a.set, prods, a.rows.length, new Date()); r.novo = true; a.rows.unshift(r); a.gerado = new Date(); mudou = true;
  });
  const vis = S.abas.find(a => a.key === S.abaAtiva)?.modo === 'online' || (S.comparar && S.abas.find(a => a.key === S.compararCom)?.modo === 'online');
  if (mudou && route().p === 'resultados' && vis && !S.dlg) renderView();
}, 15000);

onRoute();
